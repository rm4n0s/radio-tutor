<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bdcff"/>
      <stop offset="1" stop-color="#e9f9ff"/>
    </linearGradient>
    <radialGradient id="sun-glow">
      <stop offset="0" stop-color="#fff59d"/>
      <stop offset="1" stop-color="#fff59d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-left"><rect x="500" y="150" width="300" height="540"/></clipPath>
    <clipPath id="clip-right"><rect x="800" y="150" width="300" height="540"/></clipPath>
    <g id="pizza-art">
      <circle cx="800" cy="420" r="240" fill="#e59a2f"/>
      <circle cx="800" cy="420" r="208" fill="#ffd54f"/>
      <circle cx="800" cy="420" r="208" fill="none" stroke="#ffb300" stroke-width="8" stroke-dasharray="3 22" stroke-linecap="round"/>
      <circle cx="690" cy="330" r="38" fill="#d32f2f"/>
      <circle cx="690" cy="330" r="28" fill="#ef5350"/>
      <circle cx="730" cy="470" r="38" fill="#d32f2f"/>
      <circle cx="730" cy="470" r="28" fill="#ef5350"/>
      <circle cx="905" cy="325" r="38" fill="#d32f2f"/>
      <circle cx="905" cy="325" r="28" fill="#ef5350"/>
      <circle cx="880" cy="500" r="38" fill="#d32f2f"/>
      <circle cx="880" cy="500" r="28" fill="#ef5350"/>
      <circle cx="660" cy="430" r="15" fill="#43a047"/>
      <circle cx="770" cy="250" r="15" fill="#43a047"/>
      <circle cx="850" cy="390" r="15" fill="#43a047"/>
      <circle cx="820" cy="590" r="15" fill="#43a047"/>
      <circle cx="750" cy="580" r="15" fill="#43a047"/>
      <circle cx="960" cy="420" r="15" fill="#43a047"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1440" cy="150" r="150" fill="url(#sun-glow)"/>
  <circle cx="1440" cy="150" r="70" fill="#ffeb3b"/>
  <ellipse cx="260" cy="170" rx="120" ry="44" fill="#ffffff"/>
  <ellipse cx="330" cy="140" rx="80" ry="46" fill="#ffffff"/>
  <ellipse cx="1180" cy="260" rx="100" ry="36" fill="#ffffff" opacity="0.9"/>
  <rect x="0" y="700" width="1600" height="200" fill="#ffcc80"/>
  <rect x="0" y="694" width="1600" height="14" fill="#f57c00"/>
  <circle cx="800" cy="420" r="272" fill="#ffffff" stroke="#cfd8dc" stroke-width="10"/>

  <g id="title">
    <text x="800" y="100" font-family="sans-serif" font-size="84" font-weight="bold" text-anchor="middle" fill="#283593">Sharing a pizza</text>
  </g>

  <g id="friend-left">
    <rect x="190" y="600" width="140" height="120" rx="46" fill="#29b6f6"/>
    <circle cx="260" cy="540" r="80" fill="#f6c28b"/>
    <path d="M182 520 Q190 450 260 450 Q330 450 338 520 Q300 480 260 482 Q220 480 182 520 Z" fill="#6d4c41"/>
    <circle cx="232" cy="545" r="20" fill="#ffffff"/>
    <circle cx="288" cy="545" r="20" fill="#ffffff"/>
    <circle cx="236" cy="548" r="9" fill="#212121"/>
    <circle cx="284" cy="548" r="9" fill="#212121"/>
    <circle cx="208" cy="580" r="12" fill="#ff8a80" opacity="0.7"/>
    <circle cx="312" cy="580" r="12" fill="#ff8a80" opacity="0.7"/>
    <path d="M230 580 Q260 612 290 580" fill="none" stroke="#bf360c" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g id="friend-right">
    <rect x="1270" y="600" width="140" height="120" rx="46" fill="#ab47bc"/>
    <circle cx="1340" cy="540" r="80" fill="#c68642"/>
    <path d="M1260 520 Q1262 450 1340 450 Q1418 450 1420 520 Q1380 478 1340 480 Q1300 478 1260 520 Z" fill="#212121"/>
    <circle cx="1312" cy="545" r="20" fill="#ffffff"/>
    <circle cx="1368" cy="545" r="20" fill="#ffffff"/>
    <circle cx="1316" cy="548" r="9" fill="#212121"/>
    <circle cx="1364" cy="548" r="9" fill="#212121"/>
    <circle cx="1288" cy="580" r="12" fill="#ff8a80" opacity="0.7"/>
    <circle cx="1392" cy="580" r="12" fill="#ff8a80" opacity="0.7"/>
    <path d="M1310 580 Q1340 612 1370 580" fill="none" stroke="#bf360c" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g id="pizza"><use href="#pizza-art"/></g>
  <g id="half-left"><use href="#pizza-art" clip-path="url(#clip-left)"/></g>
  <g id="half-right"><use href="#pizza-art" clip-path="url(#clip-right)"/></g>

  <g id="cut-line">
    <line x1="800" y1="150" x2="800" y2="690" stroke="#1565c0" stroke-width="12" stroke-dasharray="30 18" stroke-linecap="round"/>
  </g>

  <g id="label-half">
    <text x="800" y="830" font-family="sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#4a148c">one half = 1/2</text>
  </g>
  <g id="sum-text">
    <text x="800" y="830" font-family="sans-serif" font-size="120" font-weight="bold" text-anchor="middle" fill="#1b5e20">1/2 + 1/2 = 1</text>
  </g>
</svg>
